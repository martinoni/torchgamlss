[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "torchgamlss"
version = "0.0.0"
description = "Generalized Additive Models for Location, Scale and Shape in PyTorch"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "TorchGAMLSS contributors" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "formulaic>=1.2,<2",
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.11",
  "torch>=2.4",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-cov>=5",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.9",
]

[project.urls]
Repository = "https://github.com/martinoni/torchgamlss"
Issues = "https://github.com/martinoni/torchgamlss/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/torchgamlss"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
