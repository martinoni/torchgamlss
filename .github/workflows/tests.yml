name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest

  quality:
    name: Package quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pip check
      - run: python -m compileall -q src/torchgamlss

  package:
    name: Build and install distributions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install "build>=1.2" "twine>=6"
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install wheel in a clean environment
        shell: bash
        run: |
          python -m venv "${RUNNER_TEMP}/torchgamlss-smoke"
          "${RUNNER_TEMP}/torchgamlss-smoke/bin/python" -m pip install --upgrade pip
          "${RUNNER_TEMP}/torchgamlss-smoke/bin/python" -m pip install dist/*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/torchgamlss-smoke/bin/python" \
            "${GITHUB_WORKSPACE}/tools/smoke_test_install.py"
      - uses: actions/upload-artifact@v7
        with:
          name: torchgamlss-distributions
          path: dist/*
          if-no-files-found: error

  r-parity:
    name: R parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          use-public-rspm: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: Rscript tools/install_r_dependencies.R
      - run: Rscript tools/generate_r_references.R --check
      - name: Run end-to-end Normal location-scale parity
        run: >-
          python tools/run_parity.py
          examples/normal_location_scale/parity.json
          --output-dir work/parity/normal-location-scale
      - name: Run Poisson versus NBI model-comparison parity
        run: >-
          python tools/run_parity.py
          examples/count_model_comparison/parity.json
          --output-dir work/parity/count-model-comparison
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: normal-location-scale-parity
          path: work/parity/normal-location-scale
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: count-model-comparison-parity
          path: work/parity/count-model-comparison
          if-no-files-found: warn
