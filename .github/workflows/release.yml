name: Publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated release tag to publish, for example v0.1.0a1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: testpypi-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build tagged distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify annotated tag and package version
        shell: bash
        run: |
          test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = "tag"
          test "$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")" = \
            "$(git rev-parse HEAD)"
          python - <<'PY'
          import ast
          import os
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          expected = tag.removeprefix("v")
          module = ast.parse(
              Path("src/torchgamlss/__init__.py").read_text(encoding="utf-8")
          )
          versions = [
              ast.literal_eval(node.value)
              for node in module.body
              if isinstance(node, ast.Assign)
              and any(
                  isinstance(target, ast.Name) and target.id == "__version__"
                  for target in node.targets
              )
          ]
          if versions != [expected]:
              raise SystemExit(
                  f"tag {tag!r} does not match package version {versions!r}"
              )
          PY
      - name: Build and validate distributions
        run: |
          python -m pip install "build>=1.2" "twine>=6"
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: release-distributions-${{ inputs.tag }}
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/p/torchgamlss
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-distributions-${{ inputs.tag }}
          path: dist/
      - name: Publish distributions with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
